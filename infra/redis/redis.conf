# =============================================================================
# Redis — Configuração
# Usado como: bus de eventos (Streams) + deduplicação (SET com TTL)
# =============================================================================

# Persistência — AOF garante que os streams não percam mensagens em crash
appendonly yes
appendfsync everysec

# Limite de memória (ajuste conforme o hardware do edge)
# Para 100 sensores com streams e dedup, 256mb é mais que suficiente
maxmemory 256mb

# Política de eviction — quando atingir maxmemory
# noeviction: retorna erro em vez de deletar dados — correto para streams
maxmemory-policy noeviction

# Tamanho máximo de cada stream (evita crescimento ilimitado)
# O Persistence Service consome e os dados vão pro InfluxDB/Postgres
# Manter os últimos 10000 eventos por stream é suficiente como buffer
# Configurado via XADD com MAXLEN nos próprios serviços

# Log level
loglevel notice

# Salva snapshot a cada 60s se houve pelo menos 1000 mudanças
save 60 1000
