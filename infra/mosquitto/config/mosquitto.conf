# =============================================================================
# Mosquitto — Configuração do broker MQTT
# =============================================================================

# Listener MQTT padrão
listener 1883
protocol mqtt

# Listener WebSocket (útil para debug via browser/MQTT Explorer)
listener 9001
protocol websockets

# Autenticação obrigatória — nenhuma conexão anônima permitida
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistência de sessões (QoS 1 — mensagens não entregues ficam em fila)
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Limite de conexões por cliente
max_connections 200

# Keep-alive máximo (segundos)
max_keepalive 300
